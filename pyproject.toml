[project]
name = "pack-porter"
version = "0.1.0"
description = "Pack Porter：Minecraft 基础 Mod 安装器（Modrinth + CurseForge）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13",
]

[project.scripts]
pack-porter = "pack_porter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pack_porter"]
