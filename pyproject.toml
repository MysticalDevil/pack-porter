[project]
name = "mc-mod-installer"
version = "0.1.0"
description = "Minecraft 基础 Mod 安装器（Modrinth + CurseForge）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13",
]

[project.scripts]
mc-mod-installer = "mc_mod_installer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mc_mod_installer"]
